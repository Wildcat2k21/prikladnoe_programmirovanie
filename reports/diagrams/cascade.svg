<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:940px;height:179px;background:#FFFFFF;" width="940px" height="179px" viewBox="0 0 940 179" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity ZT--><g class="entity" data-qualified-name="ZT" id="ent0001" data-source-line="7"><rect x="170.29" y="20.97" width="81.934" height="33.969" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="180.29" y="42.109" fill="#000" font-size="12" textLength="61.934" font-family="'DejaVu Sans'">z* = 1.5 м</text></g><!--entity PDZ--><g class="entity" data-qualified-name="PDZ" id="ent0002" data-source-line="8"><rect x="358.24" y="7" width="142.596" height="61.906" fill="#E2EFDA" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="368.24" y="28.139" fill="#000" font-size="12" textLength="92.543" font-weight="700" font-family="'DejaVu Sans'">PD по высоте</text><text x="368.24" y="42.107" fill="#000" font-size="12" textLength="89.25" font-family="'DejaVu Sans'">Kp=25, Kd=10</text><text x="368.24" y="56.076" fill="#000" font-size="12" textLength="122.596" font-family="'DejaVu Sans'">T = m(g + a_z)/cosθ</text></g><!--entity XT--><g class="entity" data-qualified-name="XT" id="ent0003" data-source-line="9"><rect x="7" y="117.97" width="71.287" height="33.969" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="17" y="139.109" fill="#000" font-size="12" textLength="51.287" font-family="'DejaVu Sans'">x* = 0 м</text></g><!--entity PDX--><g class="entity" data-qualified-name="PDX" id="ent0004" data-source-line="10"><rect x="139.29" y="104" width="143.949" height="61.906" fill="#E2EFDA" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="149.29" y="125.139" fill="#000" font-size="12" textLength="51.387" font-weight="700" font-family="'DejaVu Sans'">PD по x</text><text x="149.29" y="139.107" fill="#000" font-size="12" textLength="85.43" font-family="'DejaVu Sans'">Kp=1, Kd=1.5</text><text x="149.29" y="153.076" fill="#000" font-size="12" textLength="123.949" font-family="'DejaVu Sans'">θ* ∈ [−0.4; 0.4] рад</text></g><!--entity PDT--><g class="entity" data-qualified-name="PDT" id="ent0005" data-source-line="11"><rect x="361.04" y="104" width="136.988" height="61.906" fill="#E2EFDA" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="371.04" y="125.139" fill="#000" font-size="12" textLength="74.35" font-weight="700" font-family="'DejaVu Sans'">PD по углу</text><text x="371.04" y="139.107" fill="#000" font-size="12" textLength="104.52" font-family="'DejaVu Sans'">Kp=1600, Kd=56</text><text x="371.04" y="153.076" fill="#000" font-size="12" textLength="116.988" font-family="'DejaVu Sans'">τ = I(Kp·Δθ − Kd·θ̇)</text></g><!--entity MIX--><g class="entity" data-qualified-name="MIX" id="ent0006" data-source-line="12"><rect x="569.83" y="56" width="126.723" height="61.906" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="579.83" y="77.139" fill="#000" font-size="12" textLength="57.967" font-weight="700" font-family="'DejaVu Sans'">Микшер</text><text x="579.83" y="91.107" fill="#000" font-size="12" textLength="106.547" font-family="'DejaVu Sans'">F_л = T/2 + τ/(2l)</text><text x="579.83" y="105.076" fill="#000" font-size="12" textLength="106.723" font-family="'DejaVu Sans'">F_п = T/2 − τ/(2l)</text></g><!--entity Q--><g class="entity" data-qualified-name="Q" id="ent0007" data-source-line="13"><rect x="806.55" y="49.02" width="120.389" height="75.875" fill="#EEE" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="816.55" y="70.159" fill="#000" font-size="12" textLength="100.389" font-weight="700" font-family="'DejaVu Sans'">Квадрокоптер</text><text x="816.55" y="84.127" fill="#000" font-size="12" textLength="81.094" font-family="'DejaVu Sans'">m = 0.613 кг</text><text x="816.55" y="98.096" fill="#000" font-size="12" textLength="98.256" font-family="'DejaVu Sans'">I = 0.0064 кг·м²</text><text x="816.55" y="112.065" fill="#000" font-size="12" textLength="60.604" font-family="'DejaVu Sans'">l = 0.15 м</text></g><!--link ZT to PDZ--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="15" data-link-type="dependency"><path d="M252.69,37.96 C282.27,37.96 318.18,37.96 353.09,37.96" style="stroke:#181818;stroke-width:1;" fill="none" id="ZT-to-PDZ"/><polygon points="358.09,37.96,349.09,33.96,353.09,37.96,349.09,41.96,358.09,37.96" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link PDZ to MIX--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk9" data-source-line="16" data-link-type="dependency"><path d="M501.06,55.09 C523.33,60.5 542.901,65.259 564.581,70.529" style="stroke:#181818;stroke-width:1;" fill="none" id="PDZ-to-MIX"/><polygon points="569.44,71.71,561.639,65.697,564.581,70.529,559.75,73.471,569.44,71.71" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="531.83" y="59.599" fill="#000" font-size="12" font-family="'DejaVu Sans'">T</text></g><!--link XT to PDX--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="17" data-link-type="dependency"><path d="M78.57,134.96 C96.13,134.96 113.08,134.96 133.99,134.96" style="stroke:#181818;stroke-width:1;" fill="none" id="XT-to-PDX"/><polygon points="138.99,134.96,129.99,130.96,133.99,134.96,129.99,138.96,138.99,134.96" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link PDX to PDT--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-source-line="18" data-link-type="dependency"><path d="M283.68,134.96 C308.53,134.96 331.32,134.96 355.86,134.96" style="stroke:#181